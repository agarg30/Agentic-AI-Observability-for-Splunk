# ── Alert: Agent Down (No Sessions) ───────────────────────────────────────────
[AI Agent - Agent Silent]
search = index=agent_sessions earliest=-2h | stats dc(agent_id) as active_agents | where active_agents < 3
description = Fires when fewer than 3 agents are active — possible agent outage
cron_schedule = */30 * * * *
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 3
alert.track = 1
action.script = 1
action.script.filename = alert_action.py
