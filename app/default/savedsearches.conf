# Saved Searches and Alerts — AI Agent Observability
# These alerts fire automatically when anomaly thresholds are breached
# and trigger the auto-remediation action handler

# ── Alert: High Anomaly Rate ───────────────────────────────────────────────────
[AI Agent - High Anomaly Rate]
search = index=agent_sessions earliest=-1h | stats count as total, count(eval(anomaly_type!="normal")) as anomalies | eval anomaly_rate=round(anomalies/total*100,1) | where anomaly_rate > 20
description = Fires when more than 20% of agent sessions in the last hour are anomalous
cron_schedule = */15 * * * *
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.track = 1
alert_condition = search count > 0
action.script = 1
action.script.filename = alert_action.py

# ── Alert: Cost Spike Detected ─────────────────────────────────────────────────
[AI Agent - Cost Spike Detected]
search = index=agent_sessions earliest=-1h anomaly_type=cost_spike | stats count as spike_count | where spike_count > 3
description = Fires when more than 3 cost spike sessions occur in the last hour
cron_schedule = */15 * * * *
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 3
alert.track = 1
action.script = 1
action.script.filename = alert_action.py

